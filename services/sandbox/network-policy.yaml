# Firewall for the sandbox pod: model-written code gets NO network.
# Egress is empty, so the pod cannot reach the internet, the databases,
# or any other service — only answer the requests that come to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-egress
spec:
  podSelector:
    matchLabels:
      app: sandbox-service
  policyTypes:
    - Egress
  egress: []
