services:
  # Chat history, sessions, document metadata.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragadmin -d rag_db"]
      interval: 5s
      retries: 5

  # Semantic cache.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # Vector store.
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Knowledge graph.
  neo4j:
    image: neo4j:5.16.0-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  # Local Azure Blob storage, so ingestion uses one code path everywhere.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

# if the container is deleted, does losing its data cost me real work?
# example re-embedding 1,000 documents costs time and GPU money
# redis -> no; is a cache, by definition anything in it could be re-computed.
volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  azurite_data:
