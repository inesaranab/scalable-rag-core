[project]
name = "scalable-rag-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "neo4j>=6.2.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "ray[data]>=2.57.0",
    "unstructured[pdf]>=0.25.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
