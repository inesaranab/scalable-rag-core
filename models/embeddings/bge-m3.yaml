# models/embeddings/bge-m3.yaml
model_config:
  model_id: "BAAI/bge-m3"

  # Batch size for embedding generation (Higher = faster ingestion)
  batch_size: 32

  # Normalize vectors for Cosine Similarity
  normalize_embeddings: true

  # Precision: FP16 is faster on T4/A10 GPUs
  dtype: "float16"

  # Max sequence length (BGE-M3 supports 8192, but we chunk at 512 for RAG precision)
  max_seq_length: 8192

  # Hardware: fits in 0.5 GPU (fractional). Azure's NVadsA10v5 series offers
  # partial A10 GPUs down to 1/6, so a Standard_NV18ads_A10_v5 (1/2 GPU, 12 GB)
  # runs this alongside another 0.5-GPU workload on one card.
